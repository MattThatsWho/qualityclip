name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.2.1
      - run: |
          for mc in 26.1.2 26.2 26.3; do
            gradle build --no-daemon -Pmc_target=$mc
          done
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            build/libs/qualityclip-*-26.[0-9].jar
            build/libs/qualityclip-*-26.[0-9].[0-9].jar
