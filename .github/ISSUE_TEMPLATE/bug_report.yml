name: Bug report
description: Something in QualityClip isn't working
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Press K\n2. ...\n3. ..."
  - type: input
    id: mod_version
    attributes:
      label: QualityClip version
      placeholder: 0.0.3
    validations:
      required: true
  - type: dropdown
    id: mc_version
    attributes:
      label: Minecraft version
      options: ["26.1.2", "26.2", "26.3", "Other"]
    validations:
      required: true
  - type: input
    id: others
    attributes:
      label: Other mods (Fabric API / Mod Menu / Scribble versions, etc.)
  - type: textarea
    id: logs
    attributes:
      label: Log or crash report
      description: Paste `latest.log` (search it for lines starting with `QualityClip`) or a gist/mclo.gs link.
      render: text
